[workspace]
name = "markbujehein-site"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"

# Single source of truth for Python dependencies is pyproject.toml.
[pypi-dependencies]
markbujehein-site = { path = ".", editable = true }

[tasks]
build = { cmd = "pelican content -o output -s pelicanconf.py", description = "Build the site with dev settings" }
publish = { cmd = "pelican content -o output -s publishconf.py", description = "Build the site with production settings" }
serve = { cmd = "pelican -lr content -o output -s pelicanconf.py", description = "Serve at http://localhost:8000 and rebuild on change" }
clean = { cmd = "python -c \"import shutil; shutil.rmtree('output', ignore_errors=True)\"", description = "Remove generated output" }
