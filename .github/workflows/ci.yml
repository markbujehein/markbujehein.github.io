name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --select E9,F --ignore F401,F403,F405 tools
      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable, trailing-spaces: disable, new-line-at-end-of-file: disable}}' \
            src/data/cv.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Type check and unit tests
        run: |
          pnpm run check
          pnpm test
      - name: Build
        run: pnpm exec astro build
      - name: Check output (internal links, HTML, placeholder leaks)
        run: python -I tools/check_output.py dist https://markbujehein.github.io
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: false # set to true once pixi.lock is committed
          cache: false # set to true once pixi.lock is committed
      - name: Importer tests
        run: pixi run test
