name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the token may only read the repo and deploy Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: false # set to true once pixi.lock is committed
          cache: false # set to true once pixi.lock is committed
      - run: pixi run publish --fatal warnings
      - run: python -I tools/check_output.py output https://markbujehein.github.io
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
