[project]
name = "markbujehein-site"
version = "0.1.0"
description = "Personal academic website (Pelican port of al-folio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pelican>=4.10,<5",
    "markdown>=3.5",
    "pelican-webassets>=2.0",
    "pelican-sitemap>=1.1",
    "pybtex>=0.25",
    "pygments>=2.17",
    "pyyaml>=6.0.1",
    "libsass>=0.23",
    "cssmin>=0.2",
    "rjsmin>=1.2",
    "invoke>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The site is built with Pelican and never distributed; the wheel only exists so
# that `pip install -e .` / pixi can resolve the dependencies above.
[tool.hatch.build.targets.wheel]
packages = ["py_code"]
