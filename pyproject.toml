[project]
name = "markbujehein-site"
version = "0.1.0"
description = "Personal academic website (Pelican port of al-folio)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pelican>=4.9,<5",
    "markdown>=3.5",
    "pelican-webassets>=2.0",
    "pelican-sitemap>=1.0",
    "pybtex>=0.24",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "libsass>=0.23",
    "cssmin>=0.2",
    "rjsmin>=1.2",
    "invoke>=2.2",
]

# The site is built with Pelican, not packaged as a distributable.
[tool.uv]
package = false
